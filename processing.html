<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing Tool - Bostrich.org</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <a href="index.html" class="nav-logo">Bostrich.org</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="processing.html">Processing Tool</a></li>
                <li><a href="team.html">The Team</a></li>
            </ul>
        </nav>
    </header>

    <main class="content">
        <section class="processing-section">
            <h1>Video Processing Tool</h1>
            <p>Upload a video and configure the settings for processing.</p>

            <div class="settings-container">
                <button class="btn">Upload Video</button>
                <label for="fps">Target FPS:</label>
                <input type="range" id="fps" name="fps" min="1" max="240" value="120">

                <label for="width">Width:</label>
                <input type="number" id="width" name="width" placeholder="3000">

                <label for="height">Height:</label>
                <input type="number" id="height" name="height" placeholder="1500">

                <button class="btn">Start Processing</button>
            </div>

            <div class="output-container">
                <h2>Output Window</h2>
                <div class="output-frame">Video Output will display here</div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2025 Bostrich.org. All rights reserved.</p>
    </footer>
</body>
</html>
