<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Processing</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Video Processing Application</h1>
    </header>

    <main>
        <section class="upload-section">
            <h2>Upload Your Video</h2>
            <input type="file" id="videoInput" accept="video/*">
            <button id="uploadButton">Upload & Process</button>
        </section>

        <section class="progress-section">
            <h2>Processing Progress</h2>
            <progress id="progressBar" value="0" max="100"></progress>
            <p id="progressText">Waiting for upload...</p>
        </section>

        <section class="result-section" id="resultSection" style="display: none;">
            <h2>Processed Video</h2>
            <video id="processedVideo" controls></video>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Schlieren Imaging Project. All Rights Reserved.</p>
    </footer>

    <script>
        function checkProgress() {
            fetch('/progress')
                .then(response => response.json())
                .then(data => {
                    const progressBar = document.getElementById('progressBar');
                    const progressText = document.getElementById('progressText');
                    progressBar.value = data.value;

                    if (data.value < 100) {
                        progressText.textContent = `Processing: ${data.value}%`;
                        setTimeout(checkProgress, 1000);
                    } else {
                        progressText.textContent = "Processing complete!";
                        fetchProcessedVideo();
                    }
                });
        }

        function fetchProcessedVideo() {
            fetch('/progressed-video-path')
                .then(response => response.json())
                .then(data => {
                    const videoSection = document.getElementById('resultSection');
                    const processedVideo = document.getElementById('processedVideo');
                    processedVideo.src = data.video_url;
                    videoSection.style.display = 'block';
                });
        }

        document.getElementById('uploadButton').addEventListener('click', () => {
            const formData = new FormData();
            const videoFile = document.getElementById('videoInput').files[0];
            if (!videoFile) {
                alert("Please select a video file to upload.");
                return;
            }

            formData.append("video", videoFile);

            fetch('/upload', { method: 'POST', body: formData })
                .then(response => response.json())
                .then(data => {
                    if (data.message) {
                        alert(data.message);
                        document.getElementById('progressText').textContent = "Upload successful. Processing started...";
                        checkProgress();
                    }
                })
                .catch(error => {
                    alert("An error occurred during upload. Please try again.");
                    console.error(error);
                });
        });
    </script>
</body>
</html>
